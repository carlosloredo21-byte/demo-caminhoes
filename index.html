<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SuaMarca Caminhões · demonstração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#001A4D;--ink2:#002872;--ink3:#0B3A8F;--ink-rgb:0 26 77;--acc:#00B0F0;--acc-ink:#001A4D;--acc-soft:rgb(0 176 240 / .3);--bg:#F2F4F8;--card:#fff;--tinta:#0B1220;--cinza:#5D6878;--linha:#E2E7EE;--ok:#12A150;--alerta:#E5484D;--am:#F5A524;--r:20px;--sombra:0 1px 2px rgb(11 18 32 / .04),0 12px 32px rgb(11 18 32 / .08)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tinta);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
.dsp{font-family:"Archivo",sans-serif;font-stretch:112%;font-weight:800;line-height:1.04;letter-spacing:-.01em}
.mono{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.faixa{background:var(--ink);color:#AEB8C8;font-size:12.5px}
.faixa .wrap{display:flex;gap:22px;align-items:center;height:34px;overflow:hidden;white-space:nowrap}
.faixa span{display:flex;gap:6px;align-items:center}
.faixa .ic{width:14px;height:14px}
.faixa b{color:#fff;font-weight:600}
.faixa .ex{margin-left:auto;color:var(--acc)}
header.topo{position:sticky;top:0;z-index:40;background:rgb(var(--ink-rgb) / .88);backdrop-filter:blur(14px);color:#fff;border-bottom:1px solid rgb(255 255 255 / .06)}
.topo .wrap{display:flex;align-items:center;gap:22px;height:70px}
.marca{display:flex;align-items:center;gap:10px}
.marca img{height:38px;width:auto}
.marca .lg{width:38px;height:38px;border-radius:11px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-family:Archivo;font-weight:900;font-size:20px}
.marca .nm{font-family:Archivo;font-stretch:115%;font-weight:800;font-size:19px;line-height:1}
.marca .nm small{display:block;font-family:Inter;font-weight:500;font-size:11px;color:#9AA6B8;letter-spacing:.04em;margin-top:3px}
nav.menu{display:flex;gap:2px;margin-left:18px}
nav.menu a{padding:9px 14px;border-radius:99px;font-weight:600;font-size:14px;color:#C9D2DF}
nav.menu a:hover{color:#fff;background:rgb(255 255 255 / .06)}
nav.menu a.ativo{color:#fff;background:rgb(255 255 255 / .1)}
.topo .dir{margin-left:auto;display:flex;gap:8px;align-items:center}
.ib{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#DDE4EE;background:rgb(255 255 255 / .06);border:0;cursor:pointer}
.ib:hover{background:rgb(255 255 255 / .12)}
.ib i{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--acc);color:var(--acc-ink);box-shadow:0 10px 28px -10px var(--acc)}
.btn.esc{background:var(--ink2);color:#fff}
.btn.cla{background:#fff;color:var(--tinta);border:1px solid var(--linha)}
.btn.wa{background:#1FAF5A;color:#fff}
.btn.pq{padding:9px 14px;font-size:13.5px;border-radius:11px}
.btn.lg{padding:16px 26px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.eti{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:#EEF2F7;color:var(--cinza)}
.eti .ic{width:14px;height:14px}
.eti.acc{background:var(--acc);color:var(--acc-ink)}
.eti.ok{background:#DDF7E8;color:#0B6B37}
.eti.al{background:#FDE4E5;color:#A1171C}
.eti.am{background:#FEF0D3;color:#8A5300}
.eti.vid{background:rgb(var(--ink-rgb) / .55);color:#fff;backdrop-filter:blur(6px)}
.sec{padding:70px 0}
.sec h2{font-size:clamp(28px,3.6vw,46px);margin:0}
.sec .sub{color:var(--cinza);margin:10px 0 0;font-size:16px;max-width:620px}
.cab{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.kick{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-dark,var(--acc));margin-bottom:12px;display:flex;gap:8px;align-items:center}
.kick::before{content:"";width:22px;height:2px;background:var(--acc)}
.hero{position:relative;height:clamp(660px,calc(100vh - 104px),820px);background:var(--ink);color:#fff;overflow:hidden;display:flex;align-items:center}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 60%;transform:scale(1.04);animation:kb 18s ease-out forwards}
@keyframes kb{to{transform:scale(1.12)}}
.hero .vela{position:absolute;inset:0;background:linear-gradient(90deg,rgb(var(--ink-rgb) / .97) 0%,rgb(var(--ink-rgb) / .8) 40%,rgb(var(--ink-rgb) / .25) 72%,rgb(var(--ink-rgb) / .55) 100%),linear-gradient(0deg,rgb(var(--ink-rgb) / .9),transparent 40%)}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:center;width:100%;padding-top:50px;padding-bottom:50px}
.hero h1{font-size:clamp(42px,6vw,84px);margin:18px 0 18px}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero p.hl{font-size:18px;color:#C3CCD9;max-width:540px;margin:0}
.busca{margin-top:30px;background:rgb(255 255 255 / .08);border:1px solid rgb(255 255 255 / .14);backdrop-filter:blur(18px);border-radius:22px;padding:8px;max-width:660px}
.busca .abas{display:flex;gap:4px;padding:4px}
.busca .abas button{border:0;background:none;color:#B6C1D1;font-weight:700;font-size:13.5px;padding:8px 14px;border-radius:10px;cursor:pointer}
.busca .abas button.on{background:#fff;color:var(--ink)}
.busca form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;padding:4px}
.busca select{border:0;border-radius:14px;padding:14px 12px;background:#fff;color:var(--tinta);font-weight:600;min-width:0;cursor:pointer}
.stats{display:flex;gap:36px;margin-top:34px;flex-wrap:wrap}
.stats b{display:block;font-family:Archivo;font-stretch:112%;font-size:32px;font-weight:800;color:#fff;line-height:1.1}
.stats span{font-size:13px;color:#9AA6B8}
.palco{perspective:1200px;cursor:grab;user-select:none;position:relative}
.palco:active{cursor:grabbing}
.gira{transform-style:preserve-3d;transition:transform .3s ease-out;position:relative}
.dest{display:block;background:rgb(255 255 255 / .1);border:1px solid rgb(255 255 255 / .18);backdrop-filter:blur(20px);border-radius:26px;padding:12px;box-shadow:0 50px 90px -20px rgb(0 0 0 / .7);transform:translateZ(30px)}
.dest .ft{border-radius:18px;overflow:hidden;aspect-ratio:4/3;position:relative}
.dest .ft img{width:100%;height:100%;object-fit:cover}
.dest .ft .eti{position:absolute;left:12px;top:12px}
.dest .tx{padding:14px 8px 6px;display:flex;justify-content:space-between;align-items:end;gap:10px}
.dest .tx b{font-family:Archivo;font-stretch:108%;font-size:20px;font-weight:800;display:block}
.dest .tx span{font-size:13px;color:#AEB8C8}
.dest .pr{text-align:right}
.dest .pr b{color:var(--acc);font-size:26px}
.flut{position:absolute;background:#fff;color:var(--tinta);border-radius:16px;padding:11px 15px;box-shadow:0 20px 40px -10px rgb(0 0 0 / .5);font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center;transform:translateZ(80px);white-space:nowrap}
.flut .ic{color:var(--ok)}
.flut.a{left:-36px;bottom:140px}.flut.b{right:-22px;top:34px}
.dica3d{text-align:center;font-size:11.5px;color:#7D8A9E;margin-top:16px}
.canais{background:var(--ink2);color:#93A0B4;border-top:1px solid rgb(255 255 255 / .06);overflow:hidden}
.canais .trilho{display:flex;gap:48px;padding:18px 0;white-space:nowrap;animation:corre 30s linear infinite;width:max-content}
.canais span{font-family:Archivo;font-stretch:115%;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:48px;align-items:center}
.canais span::after{content:"✦";color:var(--acc)}
@keyframes corre{to{transform:translateX(-50%)}}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.cat{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:3/4;color:#fff;background:var(--ink2);isolation:isolate}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s;z-index:-2}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgb(var(--ink-rgb) / .92),rgb(var(--ink-rgb) / .05) 62%);z-index:-1}
.cat:hover img{transform:scale(1.07)}
.cat .t{position:absolute;left:16px;right:16px;bottom:14px}
.cat b{font-family:Archivo;font-stretch:110%;font-size:19px;font-weight:800;display:block;line-height:1.1}
.cat span{font-size:12.5px;color:#C3CCD9}
.cams{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.carr{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,330px);gap:20px;overflow-x:auto;padding:4px 4px 18px;scroll-snap-type:x mandatory}
.carr>*{scroll-snap-align:start}
.cam{background:#fff;border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;position:relative}
.cam:hover{transform:translateY(-4px);box-shadow:0 24px 50px -18px rgb(11 18 32 / .35)}
.cam .im{position:relative;aspect-ratio:4/3;background:#DCE2EA;overflow:hidden;display:block}
.cam .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s,transform .6s}
.cam .im img.b{opacity:0}
.cam:hover .im img.b{opacity:1}
.cam:hover .im img{transform:scale(1.04)}
.cam .im>.eti{position:absolute;left:12px;top:12px}
.cam .acoes-c{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:2}
.cam .acoes-c button{width:36px;height:36px;border-radius:11px;border:0;background:rgb(255 255 255 / .94);display:grid;place-items:center;cursor:pointer;color:var(--tinta)}
.cam .acoes-c button.on{background:var(--acc);color:var(--acc-ink)}
.cam .acoes-c .ic{width:18px;height:18px}
.cam .selo{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}
.cam .tx{padding:16px 18px 18px;display:flex;flex-direction:column;gap:3px;flex:1}
.cam .tx .mod{font-family:Archivo;font-stretch:108%;font-weight:800;font-size:18px;line-height:1.15}
.cam .tx .sp{color:var(--cinza);font-size:13px}
.cam .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.cam .chips span{font-size:12px;font-weight:600;background:var(--bg);border-radius:8px;padding:4px 8px;color:#3B4656}
.cam .pe{display:flex;justify-content:space-between;align-items:end;margin-top:auto;padding-top:12px;border-top:1px solid var(--linha)}
.cam .pr{font-family:Archivo;font-stretch:106%;font-size:23px;font-weight:800}
.cam .pa{font-size:12px;color:var(--cinza)}
.cam .un{font-size:12px;color:var(--cinza);display:flex;gap:4px;align-items:center}
.cam .un .ic{width:14px;height:14px}
.quiz{background:var(--ink);color:#fff;border-radius:30px;padding:46px;display:grid;grid-template-columns:.85fr 1.15fr;gap:44px;position:relative;overflow:hidden}
.quiz::before{content:"";position:absolute;right:-140px;top:-140px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,var(--acc-soft),transparent 70%)}
.quiz h2{font-size:clamp(28px,3.4vw,44px)}
.quiz p{color:#AEB8C8}
.perg{display:grid;gap:20px;position:relative}
.perg h4{margin:0 0 9px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#93A0B4}
.opc{display:flex;flex-wrap:wrap;gap:8px}
.opc button{border:1px solid rgb(255 255 255 / .16);background:rgb(255 255 255 / .05);color:#fff;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer}
.opc button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.rec{background:rgb(255 255 255 / .06);border:1px solid rgb(255 255 255 / .1);border-radius:18px;padding:12px;display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center}
.rec img{width:120px;height:86px;object-fit:cover;border-radius:12px}
.rec b{font-family:Archivo;font-stretch:108%;font-size:18px}
.porque{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pq-i{background:#fff;border-radius:var(--r);padding:24px;box-shadow:var(--sombra)}
.pq-i .bx{width:50px;height:50px;border-radius:15px;background:var(--ink2);color:var(--acc);display:grid;place-items:center;margin-bottom:16px}
.pq-i .bx .ic{width:24px;height:24px}
.pq-i b{display:block;font-size:17px;margin-bottom:6px}
.pq-i span{color:var(--cinza);font-size:14px}
.placa-band{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;background:#fff;border-radius:30px;padding:40px;box-shadow:var(--sombra)}
.placa{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.placa .pl{flex:1;display:flex;align-items:stretch;border:2.5px solid var(--tinta);border-radius:12px;overflow:hidden;max-width:300px;min-width:220px;background:#fff}
.placa .pl span{background:#1E4FB8;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 8px;letter-spacing:.06em;writing-mode:vertical-rl;transform:rotate(180deg)}
.placa .pl input{border:0;padding:12px 14px;font-family:Archivo;font-stretch:125%;font-weight:800;font-size:26px;letter-spacing:.12em;width:100%;text-transform:uppercase;outline:0;min-width:0}
.achado{margin-top:16px;padding:14px 16px;border-radius:14px;background:#EEF8F2;color:#0B5A31;font-weight:600;display:flex;gap:10px;align-items:center}
.mini-pecas{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mini-pecas .peca .vis{aspect-ratio:16/7}.mini-pecas .peca .vis .ic{width:44px;height:44px}
.unids{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.unid{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
.unid .ft{aspect-ratio:16/9;background:var(--ink2);overflow:hidden}
.unid .ft img{width:100%;height:100%;object-fit:cover}
.unid .tx{padding:18px 20px 20px;display:grid;gap:6px}
.unid b{font-family:Archivo;font-stretch:110%;font-size:21px;font-weight:800}
.unid .ln{display:flex;gap:8px;align-items:center;color:var(--cinza);font-size:14px}
.unid .ln .ic{width:16px;height:16px}
.pag-top{background:var(--ink);color:#fff;padding:46px 0 34px;position:relative;overflow:hidden}
.pag-top::after{content:"";position:absolute;right:-100px;top:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--acc-soft),transparent 70%)}
.pag-top h1{font-size:clamp(32px,4.4vw,56px);margin:4px 0 8px}
.pag-top p{color:#AEB8C8;margin:0}
.lay-est{display:grid;grid-template-columns:270px 1fr;gap:26px;align-items:start;padding:28px 0 70px}
.filtros{position:sticky;top:90px;background:#fff;border-radius:var(--r);box-shadow:var(--sombra);padding:20px;display:flex;flex-direction:column;gap:18px}
.filtros h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cinza)}
.filtros input,.filtros select{width:100%;border:1px solid var(--linha);border-radius:12px;padding:11px 12px;background:var(--bg)}
.pil{display:flex;flex-wrap:wrap;gap:6px}
.pil button{border:1px solid var(--linha);background:#fff;border-radius:10px;padding:7px 11px;font-weight:600;font-size:13px;cursor:pointer}
.pil button.on{background:var(--ink2);border-color:var(--ink2);color:#fff}
.barra-res{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.barra-res select{border:1px solid var(--linha);border-radius:11px;padding:9px 12px;background:#fff;font-weight:600}
.ficha-top{padding:24px 0 6px}
.volta{display:inline-flex;gap:6px;align-items:center;color:var(--cinza);font-weight:600;font-size:14px}
.mosaico{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:min(540px,56vw);border-radius:24px;overflow:hidden;margin-top:14px;position:relative}
.mosaico button{border:0;padding:0;cursor:pointer;overflow:hidden;background:#DCE2EA;position:relative}
.mosaico button:first-child{grid-row:span 2}
.mosaico img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.mosaico button:hover img{transform:scale(1.03)}
.mosaico .todas{position:absolute;right:14px;bottom:14px;background:#fff;border-radius:11px;padding:9px 14px;font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;box-shadow:var(--sombra)}
.ficha{display:grid;grid-template-columns:1fr 410px;gap:30px;align-items:start;padding:26px 0 70px}
.ficha h1{font-size:clamp(30px,3.6vw,48px);margin:12px 0 6px}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.specs div{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--sombra)}
.specs .ic{color:var(--cinza);margin-bottom:8px}
.specs small{display:block;color:var(--cinza);font-size:12px}
.specs b{font-size:14.5px}
.bloco{background:#fff;border-radius:var(--r);box-shadow:var(--sombra);padding:24px;margin-top:18px}
.bloco h3{margin:0 0 14px;font-size:18px}
.check{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px}
.check div{display:flex;gap:8px;align-items:center;font-size:14px}
.check .ic{color:var(--ok);width:18px;height:18px}
.lado{position:sticky;top:90px;background:#fff;border-radius:24px;box-shadow:0 30px 60px -24px rgb(11 18 32 / .35);padding:24px}
.lado .pr{font-family:Archivo;font-stretch:108%;font-size:42px;font-weight:800;line-height:1.05}
.tabs-sim{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;margin:16px 0 14px}
.tabs-sim button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:700;font-size:13px;cursor:pointer;color:var(--cinza)}
.tabs-sim button.on{background:#fff;color:var(--tinta);box-shadow:0 1px 4px rgb(0 0 0 / .08)}
.sim label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--cinza);margin-bottom:12px}
.sim label div{display:flex;justify-content:space-between}
.sim label b{color:var(--tinta)}
.sim input[type=range]{width:100%;accent-color:var(--ink2)}
.parc{background:var(--ink);color:#fff;border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px}
.parc b{font-family:Archivo;font-stretch:108%;font-size:32px;color:var(--acc)}
.parc small{color:#93A0B4;font-size:12px;display:block}
.lado .btns{display:grid;gap:10px}
.cn-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.cn-chips span{font-size:12px;font-weight:600;border:1px solid var(--linha);border-radius:8px;padding:4px 8px}
.modal{position:fixed;inset:0;background:rgb(var(--ink-rgb) / .72);backdrop-filter:blur(6px);z-index:80;display:grid;place-items:center;padding:20px}
.modal .cx{background:#fff;border-radius:26px;max-width:520px;width:100%;padding:28px;position:relative;max-height:92vh;overflow:auto}
.modal .fecha{position:absolute;right:16px;top:16px;border:0;background:var(--bg);width:38px;height:38px;border-radius:11px;cursor:pointer;display:grid;place-items:center}
.pix{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;background:var(--bg);border-radius:18px;padding:16px;margin:16px 0}

  <div class="bloco rolagem"><table class="tb"><tr><th>Peça</th><th>Preço</th>${UNIDADES.map((u) => `<th>${esc(u.curto)}</th>`).join("")}<th>Site</th><th>Mercado Livre</th></tr>${PECAS.map((p) => `<tr><td><b>${esc(p.nome)}</b></td><td class="mono">${brl(p.preco)}</td>${p.est.map((e) => `<td>${e}</td>`).join("")}<td><span class="eti ok">no ar</span></td><td>${p.ml ? `<span class="eti ok">no ar</span>` : `<span class="eti">publicar</span>`}</td></tr>`).join("")}</table></div>`;
}

const GANHO = { leads: 40, fech: 8, ticket: 260000, extra: 20, pontos: 1, pecasPed: 120, pecasTicket: 380, anuncios: 30, min: 40, canais: 4, hora: 45 };
function telaGanho() {
  const c = [["leads", "Interessados em caminhão por mês (hoje)"], ["fech", "Fechamento hoje (%)"], ["ticket", "Valor médio do caminhão vendido (R$)"], ["extra", "Interessados a mais pelo site e portais"], ["pontos", "Pontos a mais de fechamento"], ["pecasPed", "Pedidos de peças online por mês"], ["pecasTicket", "Valor médio do pedido de peças (R$)"], ["anuncios", "Caminhões anunciados por mês"], ["min", "Minutos para anunciar em cada canal (hoje)"], ["canais", "Canais de anúncio"], ["hora", "Custo da hora da equipe (R$)"]];
  return `<div class="pag-top"><div class="wrap"><div class="kick">Calculadora</div><h1 class="dsp">Quanto rende para a sua loja?</h1><p>Coloque os números da loja. Os padrões são só um exemplo.</p></div></div>
  <div class="wrap"><div class="ganho"><div class="cx-b">${c.map(([k, r]) => `<label>${r}<input type="number" data-g="${k}" value="${GANHO[k]}"></label>`).join("")}</div><div class="result-g" id="resg"></div></div></div>`;
}
function ligarGanho() {
  const calc = () => {
    $$("[data-g]").forEach((i) => (GANHO[i.dataset.g] = +i.value || 0));
    const g = GANHO, hoje = (g.leads * g.fech) / 100, dep = ((g.leads + g.extra) * (g.fech + g.pontos)) / 100, fc = (dep - hoje) * g.ticket, fp = g.pecasPed * g.pecasTicket, h = (g.anuncios * g.min * Math.max(0, g.canais - 1)) / 60;
    const f1 = (x) => x.toFixed(1).replace(".", ",");
    $("#resg").innerHTML = `<span style="color:#93A0B4">Vendas a mais por mês (exemplo)</span><div class="big mono">${brl(fc + fp)}</div><div class="ln"><span>Caminhões vendidos por mês</span><b>${f1(hoje)} → ${f1(dep)}</b></div><div class="ln"><span>Vendas a mais em caminhões</span><b class="mono">${brl(fc)}</b></div><div class="ln"><span>Peças vendidas online</span><b class="mono">${brl(fp)}</b></div><div class="ln"><span>Horas de cadastro economizadas</span><b>${Math.round(h)} h · ${brl(h * g.hora)}</b></div><small style="color:#6B788C">Simulação hipotética. Os números reais saem do diagnóstico.</small>`;
  };
  $$("[data-g]").forEach((i) => (i.oninput = calc)); calc();
}

function render() {
  const h = (location.hash || "#inicio").slice(1);
  let r = h, id = null;
  if (h.startsWith("veiculo-")) { r = "veiculo"; id = h.slice(8); }
  if (h.startsWith("estoque-")) { r = "estoque"; id = h.slice(8); }
  if (h === "inicio-unidades") { r = "inicio"; id = "unidades"; }
  $$("#menu a").forEach((a) => a.classList.toggle("ativo", (a.dataset.r === r && id !== "0km") || (id === "0km" && a.dataset.r === "0km") || (id === "unidades" && a.dataset.r === "unidades") || (r === "veiculo" && a.dataset.r === "estoque")));
  const T = { inicio: [telaInicio, ligarInicio], estoque: [() => telaEstoque(id), ligarEstoque], veiculo: [() => telaVeiculo(id), () => ligarVeiculo(id)], comparar: [telaComparar, ligarCards], pecas: [telaPecas, ligarPecas], carrinho: [telaCarrinho, ligarCarrinho], painel: [telaPainel, ligarPainel], ganho: [telaGanho, ligarGanho] }[r] || [telaInicio, ligarInicio];
  $("#app").innerHTML = T[0](); T[1]();
  $("#waFlut").hidden = r === "painel";
  attContadores();
  if (id === "unidades") setTimeout(() => $("#unidades").scrollIntoView(), 30);
}
window.addEventListener("hashchange", () => { fechar(); render(); if (location.hash !== "#inicio-unidades") window.scrollTo(0, 0); });
document.addEventListener("click", (e) => { if (e.target.closest("#irCad")) { estado.aba = "cadastro"; render(); } });

const cena = new URLSearchParams(location.search).get("cena");
if (cena) document.documentElement.style.scrollBehavior = "auto";
if (cena) MARCA.rapido = true;
if (cena === "carrinho") estado.carrinho = [{ id: "p1", qtd: 2 }, { id: "p3", qtd: 1 }, { id: "p5", qtd: 1 }];
if (cena === "doc") { estado.aba = "cadastro"; estado.cad = { passo: 1, doc: crlvExemplo(), fotos: [], dados: DADOS_DOC }; }
if (cena === "publicar") { estado.aba = "cadastro"; estado.cad = { passo: 3, doc: null, fotos: [], dados: {} }; }
if (["leads", "anuncios", "pecaspainel"].includes(cena)) estado.aba = cena === "pecaspainel" ? "pecas" : cena;
if (cena === "comparar") estado.comp = [VEICULOS[1].id, VEICULOS[3].id, VEICULOS[6].id];
if (cena === "quiz") estado.quiz = { carga: "Grãos e carga seca", dist: "Regional" };
if (cena === "placa") estado.placa = "ABC1D23";
if (cena === "favs") { estado.fav.add(VEICULOS[1].id); estado.comp = [VEICULOS[1].id, VEICULOS[3].id]; }
casca(); render();
if (cena === "publicar") setTimeout(() => $("#pub").click(), 50);
if (cena === "reserva") setTimeout(() => { $("#reservar").click(); passoPix(VEICULOS[1], 2000); }, 50);
if (cena === "quiz") setTimeout(() => window.scrollTo(0, document.querySelector(".quiz").getBoundingClientRect().top + scrollY - 90), 80);
if (cena === "placa") setTimeout(() => window.scrollTo(0, document.querySelector(".placa-band").getBoundingClientRect().top + scrollY - 120), 80);
if (cena === "favs") setTimeout(() => window.scrollTo(0, document.querySelector(".carr").getBoundingClientRect().top + scrollY - 260), 80);
</script>
