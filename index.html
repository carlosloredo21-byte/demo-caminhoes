<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SuaMarca Caminhões · demonstração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--c1:#13202F;--c2:#1E3A5F;--acc:#F5A524;--acc-2:#FFD27A;--bg:#F3F5F8;--card:#fff;--tinta:#0F1720;--cinza:#5B6573;--linha:#E2E6EC;--ok:#16A34A;--alerta:#DC2626;--r:22px;--sombra:0 10px 30px rgb(15 23 32 / .08)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Manrope","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tinta);font-size:15px;line-height:1.5}
a{color:inherit}
button,input,select,textarea{font:inherit}
img{max-width:100%}
.aviso{background:#FFF7E0;color:#7A5300;text-align:center;font-size:12.5px;padding:6px 16px}
header.topo{position:sticky;top:0;z-index:20;background:var(--c1);color:#fff;box-shadow:0 2px 14px rgb(0 0 0 / .18)}
.topo .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:20px;letter-spacing:.01em}
.marca img{height:40px;width:auto;display:block}
.marca .sm{display:flex;flex-direction:column;line-height:1.1}
.marca .sm small{font-weight:500;font-size:12px;opacity:.75}
.marca .ico{width:38px;height:38px;border-radius:12px;background:var(--acc);display:grid;place-items:center;color:var(--c1);font-weight:800}
nav.menu{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.menu a{padding:8px 14px;border-radius:99px;text-decoration:none;font-weight:600;font-size:14px;opacity:.9}
nav.menu a:hover{background:rgb(255 255 255 / .1)}
nav.menu a.ativo{background:#fff;color:var(--c1);opacity:1}
nav.menu a.carr{background:var(--acc);color:var(--c1);opacity:1}
main{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:12px 22px;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--acc);color:var(--c1);box-shadow:0 8px 20px rgb(0 0 0 / .12)}
.btn.esc{background:var(--c1);color:#fff}
.btn.cla{background:#fff;color:var(--c1);border:1.5px solid var(--linha)}
.btn.ok{background:var(--ok);color:#fff}
.btn.pq{padding:8px 14px;font-size:13.5px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sombra);padding:20px}
h1,h2,h3{line-height:1.2;margin:0}
h2{font-size:26px;font-weight:800;margin-bottom:6px}
.sub{color:var(--cinza);margin:0 0 18px}
.eti{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:#EEF2F7;color:var(--cinza)}
.eti.novo{background:var(--acc);color:var(--c1)}
.eti.ok{background:#DCFCE7;color:#166534}
.eti.al{background:#FEE2E2;color:#991B1B}
.eti.am{background:#FEF3C7;color:#92400E}
.grade{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
/* abertura */
.hero{position:relative;border-radius:30px;overflow:hidden;background:var(--c1);color:#fff;display:grid;grid-template-columns:1.05fr 1fr;min-height:470px}
.hero .txt{padding:46px 42px;display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative;z-index:2}
.hero h1{font-size:44px;font-weight:800;line-height:1.1}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero p{font-size:17px;opacity:.85;margin:0;max-width:520px}
.hero .palco{position:relative;perspective:1100px;display:grid;place-items:center;padding:30px;cursor:grab;user-select:none}
.hero .palco:active{cursor:grabbing}
.hero .gira{width:100%;transform-style:preserve-3d;transition:transform .25s ease-out}
.hero .gira .foto{border-radius:24px;overflow:hidden;box-shadow:0 40px 70px rgb(0 0 0 / .45);transform:translateZ(40px);background:linear-gradient(160deg,#E9EEF5,#C9D4E3)}
.hero .gira .foto img{display:block;width:100%;height:330px;object-fit:cover}
.hero .gira .foto svg{display:block;width:100%;height:330px}
.hero .selo{position:absolute;right:30px;bottom:30px;background:#fff;color:var(--c1);border-radius:18px;padding:12px 16px;font-weight:700;box-shadow:var(--sombra);transform:translateZ(90px);font-size:14px}
.hero .selo b{display:block;font-size:22px}
.hero .dica3d{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;opacity:.55}
.busca{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:10px;background:#fff;border-radius:20px;padding:12px;margin-top:-34px;position:relative;z-index:3;box-shadow:var(--sombra);max-width:1080px;margin-left:auto;margin-right:auto}
.busca select,.busca input{border:1.5px solid var(--linha);border-radius:14px;padding:11px 12px;background:#fff;min-width:0}
.canais{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:28px 0 8px;color:var(--cinza);font-size:14px}
.canais span.c{background:#fff;border:1px solid var(--linha);border-radius:99px;padding:6px 12px;font-weight:700;color:var(--tinta)}
.atalhos{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:26px 0}
.atalho{border-radius:var(--r);padding:22px;background:#fff;box-shadow:var(--sombra);text-decoration:none;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.atalho:hover{transform:translateY(-3px)}
.atalho b{font-size:19px}
.atalho span{color:var(--cinza);font-size:14px}
.atalho .n{font-size:30px}
.secao{margin-top:36px}
.cab-secao{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
/* cartões de caminhão */
.cam{background:#fff;border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:transform .15s,box-shadow .15s}
.cam:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgb(15 23 32 / .14)}
.cam .im{position:relative;aspect-ratio:4/3;background:linear-gradient(160deg,#E9EEF5,#D7DFEA);overflow:hidden}
.cam .im img,.cam .im svg{width:100%;height:100%;object-fit:cover;display:block}
.cam .im .eti{position:absolute;left:12px;top:12px}
.cam .im .cn{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.cam .im .cn i{font-style:normal;font-size:10.5px;font-weight:800;background:rgb(255 255 255 / .92);border-radius:99px;padding:3px 7px;color:var(--c1)}
.cam .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.cam .tx b{font-size:16px}
.cam .tx .sp{color:var(--cinza);font-size:13px}
.cam .tx .pr{font-size:21px;font-weight:800;color:var(--c1);margin-top:auto;padding-top:6px}
.cam .tx .pa{font-size:12.5px;color:var(--cinza)}
/* estoque */
.lay-est{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.filtros{position:sticky;top:90px;display:flex;flex-direction:column;gap:14px}
.filtros label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--cinza)}
.filtros select,.filtros input{border:1.5px solid var(--linha);border-radius:12px;padding:9px 10px;background:#fff;color:var(--tinta);font-weight:500}
.pilulas{display:flex;flex-wrap:wrap;gap:6px}
.pilulas button{border:1.5px solid var(--linha);background:#fff;border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.pilulas button.on{background:var(--c1);border-color:var(--c1);color:#fff}
/* ficha */
.ficha{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;align-items:start}
.galeria .principal{border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:linear-gradient(160deg,#E9EEF5,#D7DFEA)}
.galeria .principal img,.galeria .principal svg{width:100%;height:100%;object-fit:cover;display:block}
.galeria .mini{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.galeria .mini button{width:86px;height:64px;border-radius:12px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:#E9EEF5}
.galeria .mini button.on{border-color:var(--acc)}
.galeria .mini img,.galeria .mini svg{width:100%;height:100%;object-fit:cover;display:block}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.specs div{background:var(--bg);border-radius:14px;padding:10px 12px}
.specs small{display:block;color:var(--cinza);font-size:12px}
.specs b{font-size:14.5px}
.preco-g{font-size:34px;font-weight:800;color:var(--c1)}
.simu{background:var(--bg);border-radius:18px;padding:16px;margin-top:14px;display:grid;gap:10px}
.simu label{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.simu input[type=range]{width:100%;accent-color:var(--c1)}
.simu .res{display:flex;justify-content:space-between;align-items:end;border-top:1px solid var(--linha);padding-top:10px}
.simu .res b{font-size:26px;color:var(--c1)}
.acoes{display:grid;gap:10px;margin-top:14px}
.form{display:grid;gap:10px}
.form input,.form select,.form textarea{border:1.5px solid var(--linha);border-radius:12px;padding:11px 12px;background:#fff;width:100%}
.ok-box{background:#ECFDF3;border:1px solid #BBF7D0;color:#14532D;border-radius:16px;padding:14px 16px}
/* peças */
.lay-pec{display:grid;grid-template-columns:1fr;gap:18px}
.busca-pec{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
.busca-pec input,.busca-pec select{border:1.5px solid var(--linha);border-radius:14px;padding:12px;background:#fff}
.peca{background:#fff;border-radius:var(--r);box-shadow:var(--sombra);padding:16px;display:flex;flex-direction:column;gap:6px}
.peca .ic{height:120px;border-radius:16px;background:linear-gradient(160deg,#EEF2F7,#DDE4EE);display:grid;place-items:center;font-size:50px}
.peca b{font-size:15px}
.peca .ap{font-size:12.5px;color:var(--cinza)}
.peca .pr{font-size:20px;font-weight:800;color:var(--c1)}
.peca .es{font-size:12px;color:var(--ok);font-weight:700}
/* carrinho */
.lay-car{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
.linha-car{display:grid;grid-template-columns:52px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linha)}
.linha-car .ic{width:52px;height:52px;border-radius:12px;background:#EEF2F7;display:grid;place-items:center;font-size:24px}
.qtd{display:flex;align-items:center;gap:6px}
.qtd button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--linha);background:#fff;cursor:pointer;font-weight:800}
.opcoes{display:grid;gap:8px}
.opcoes label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--linha);border-radius:14px;padding:11px 12px;cursor:pointer;font-weight:600}
.opcoes label:has(input:checked){border-color:var(--c1);background:#F5F8FC}
.tot{display:flex;justify-content:space-between;padding:6px 0}
.tot.g{font-size:20px;font-weight:800;border-top:1px solid var(--linha);padding-top:12px;margin-top:4px}
.pix{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:var(--bg);border-radius:16px;padding:12px;margin-top:10px}
.pix .qr{width:120px;height:120px;border-radius:10px;background:#fff;padding:8px}
/* painel */
.painel{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.lateral{background:var(--c1);color:#fff;border-radius:var(--r);padding:14px;position:sticky;top:90px;display:flex;flex-direction:column;gap:4px}
.lateral .t{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;padding:8px 10px 4px}
.lateral button{all:unset;cursor:pointer;padding:10px 12px;border-radius:12px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.lateral button:hover{background:rgb(255 255 255 / .08)}
.lateral button.on{background:#fff;color:var(--c1)}
.lateral button i{font-style:normal;font-size:11px;background:var(--acc);color:var(--c1);border-radius:99px;padding:1px 7px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#fff;border-radius:18px;box-shadow:var(--sombra);padding:16px}
.kpi small{color:var(--cinza);font-weight:600;font-size:12.5px}
.kpi b{display:block;font-size:28px;font-weight:800;color:var(--c1);line-height:1.2;margin-top:2px}
.kpi span{font-size:12.5px;color:var(--ok);font-weight:700}
.barras{display:grid;gap:10px}
.barra{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:13.5px;font-weight:600}
.barra .t{height:12px;border-radius:99px;background:#EEF2F7;overflow:hidden}
.barra .t i{display:block;height:100%;background:var(--c1);border-radius:99px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;font-size:11.5px;color:var(--cinza);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--linha);font-weight:700}
.tb td{padding:10px;border-bottom:1px solid var(--linha);vertical-align:middle}
.rolagem{overflow-x:auto}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#E9EDF3;border-radius:18px;padding:10px;min-width:200px}
.col h4{margin:4px 6px 10px;font-size:13px;display:flex;justify-content:space-between}
.lead{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 8px rgb(0 0 0 / .05);font-size:13px;display:grid;gap:4px}
.lead b{font-size:14px}
.lead .ori{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.lead .tmp.al{color:var(--alerta);font-weight:700}
.lead button{all:unset;cursor:pointer;font-size:12px;font-weight:700;color:var(--c1)}
/* cadastro pelo documento */
.passos-cad{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.passos-cad span{padding:7px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--linha);font-weight:700;font-size:13px;color:var(--cinza)}
.passos-cad span.on{background:var(--c1);border-color:var(--c1);color:#fff}
.passos-cad span.feito{background:#DCFCE7;border-color:#BBF7D0;color:#166534}
.cad{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.solta{border:2px dashed #B8C2D0;border-radius:20px;padding:26px;text-align:center;background:#FAFBFD;cursor:pointer;display:grid;gap:8px;place-items:center}
.solta:hover{border-color:var(--c1)}
.solta .big{font-size:44px}
.doc-prev{border-radius:16px;overflow:hidden;border:1px solid var(--linha);position:relative;background:#fff}
.doc-prev img{display:block;width:100%}
.doc-prev .scan{position:absolute;left:0;right:0;height:46px;background:linear-gradient(180deg,transparent,rgb(0 176 240 / .35),transparent);animation:scan 1.3s linear infinite}
@keyframes scan{from{top:-46px}to{top:100%}}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.campos label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--cinza)}
.campos input,.campos select,.campos textarea{border:1.5px solid var(--linha);border-radius:12px;padding:9px 10px;color:var(--tinta);font-weight:600;background:#fff}
.campos input.lido{border-color:#86EFAC;background:#F0FDF4}
.campos .w2{grid-column:span 2}
.fotos-cad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fotos-cad div{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#EEF2F7}
.fotos-cad img,.fotos-cad svg{width:100%;height:100%;object-fit:cover;display:block}
.canais-pub{display:grid;gap:8px}
.canais-pub label{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--linha);border-radius:14px;padding:11px 12px;font-weight:700;cursor:pointer}
.canais-pub label small{display:block;font-weight:500;color:var(--cinza)}
.prog{height:8px;border-radius:99px;background:#EEF2F7;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .5s}
/* ganho */
.ganho{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.ganho label{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:10px;font-size:14px;font-weight:600;padding:6px 0}
.ganho input{border:1.5px solid var(--linha);border-radius:12px;padding:8px 10px;width:100%;font-weight:700}
.result-g{background:var(--c1);color:#fff;border-radius:var(--r);padding:24px;display:grid;gap:12px}
.result-g .big{font-size:40px;font-weight:800;color:var(--acc);line-height:1.1}
.result-g .ln{display:flex;justify-content:space-between;border-bottom:1px solid rgb(255 255 255 / .12);padding:8px 0;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--c1);color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;box-shadow:var(--sombra);z-index:50}
footer{background:var(--c1);color:#fff;margin-top:40px}
footer .in{max-width:1240px;margin:0 auto;padding:28px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;font-size:13.5px;opacity:.9}
footer b{display:block;margin-bottom:4px}
@media (max-width:900px){
  .hero{grid-template-columns:1fr}.hero h1{font-size:32px}.hero .txt{padding:30px 24px}
  .busca{grid-template-columns:1fr 1fr;margin-top:14px}
  .atalhos,.lay-est,.ficha,.lay-car,.painel,.cad,.ganho{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}.specs{grid-template-columns:1fr 1fr}
  .filtros,.lateral{position:static}
  .busca-pec{grid-template-columns:1fr}
  footer .in{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="aviso">Protótipo de demonstração · veículos, preços, peças, clientes e pedidos são exemplos</div>
<header class="topo"><div class="in">
  <a class="marca" href="#inicio" id="marca"></a>
  <nav class="menu" id="menu">
    <a href="#inicio" data-r="inicio">Início</a>
    <a href="#estoque" data-r="estoque">Caminhões</a>
    <a href="#pecas" data-r="pecas">Peças</a>
    <a href="#ganho" data-r="ganho">Quanto rende?</a>
    <a href="#painel" data-r="painel">Painel da loja</a>
    <a href="#carrinho" data-r="carrinho" class="carr">🛒 <span id="ncar">0</span></a>
  </nav>
</div></header>
<main id="app"></main>
<footer><div class="in" id="rodape"></div></footer>
<div class="toast" id="toast" hidden></div>

<script>
const MARCA = {
 "nome": "SuaMarca",
 "sub": "Caminhões e Ônibus",
 "logo": null,
 "hero": null,
 "fotos": null,
 "unidades": [
  {
   "nome": "Unidade Centro",
   "curto": "Centro",
   "fone": "(00) 0000-0001"
  },
  {
   "nome": "Unidade Rodovia",
   "curto": "Rodovia",
   "fone": "(00) 0000-0002"
  },
  {
   "nome": "Unidade Norte",
   "curto": "Norte",
   "fone": "(00) 0000-0003"
  }
 ]
};
const $ = (s, el = document) => el.querySelector(s);
const brl = (v) => { const d = v >= 1000 && Math.abs(v - Math.round(v)) < 0.005 ? 0 : 2; return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: d, minimumFractionDigits: d }); };
const km = (v) => v ? v.toLocaleString("pt-BR") + " km" : "0 km";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2600); }

/* ---------- desenho de caminhão (versão sem fotos) ---------- */
function caminhaoSVG(t, fundo = true) {
  const cor = t.cor || "#E9EDF2", imp = t.implemento, tr = t.tracao || "4x2";
  const eixos2 = /^(6|8)x/.test(tr), dianteiro2 = /^8x/.test(tr);

  palco.addEventListener("mousemove", (e) => {

    if (arr) aplicar(base.x + (e.clientX - arr.x) / 3, base.y - (e.clientY - arr.y) / 4);

  palco.addEventListener("mousedown", (e) => { arr = { x: e.clientX, y: e.clientY }; });

    if (cad.dados) { $("#docprev").innerHTML = `<div class="doc-prev"><img src="${cad.doc}"></div><p style="font-weight:700;color:var(--ok);margin:8px 0 0">✓ 12 campos lidos em 2 segundos</p>`; }
  }
  if (cad.passo === 2) {
    const sug = 359900;
    corpo.innerHTML = `<div class="cad"><div class="card"><label class="solta" for="fotf"><span class="big">📸</span><b>Fotos do caminhão</b><span style="color:var(--cinza);font-size:13px">o sistema ordena: frente, lateral, cabine, painel</span></label><input type="file" id="fotf" accept="image/*" multiple hidden>
        <button class="btn cla pq" id="fotex" style="margin-top:10px">Usar fotos de exemplo</button><div class="fotos-cad" id="fotprev" style="margin-top:12px"></div></div>
      <div class="card"><div class="campos">
        <label>Quilometragem<input value="286.000"></label><label>Implemento<select><option>Carroceria</option><option>Baú</option><option>Chassi</option><option>Caçamba</option></select></label>
        <label>Unidade<select>${UNIDADES.map((u) => `<option>${esc(u.nome)}</option>`).join("")}</select></label><label>Preço de venda<input value="R$ 359.900"></label>
        <label class="w2" style="background:var(--bg);border-radius:12px;padding:10px;color:var(--tinta)">💡 Preço de referência para ${DADOS.modelo} ${DADOS.anoF}/${DADOS.anoM}: entre ${brl(sug - 25000)} e ${brl(sug + 15000)} (exemplo, a partir da FIPE e dos anúncios parecidos)</label>
        <label class="w2">Descrição do anúncio (gerada, pode editar)<textarea rows="5">VW ${DADOS.modelo} ${DADOS.versao}, ${DADOS.anoF}/${DADOS.anoM}, ${DADOS.potencia}, câmbio V-Tronic, carroceria aberta. 286 mil km, revisado na concessionária, pneus em bom estado. Aceitamos troca e financiamos. Veja na unidade ${UNIDADES[0].nome}.</textarea></label></div>
        <button class="btn esc" id="seg2" style="margin-top:12px;width:100%">Continuar para publicar</button></div></div>`;
    const mostrar = () => { $("#fotprev").innerHTML = cad.fotos.map((f) => `<div>${f.startsWith("svg:") ? caminhaoSVG({ implemento: "Carroceria", tracao: "6x2", cor: f.slice(4) }) : `<img src="${f}">`}</div>`).join(""); };
    $("#fotf").onchange = (e) => { cad.fotos = [...e.target.files].slice(0, 12).map((f) => URL.createObjectURL(f)); mostrar(); };
    $("#fotex").onclick = () => { const v = VEICULOS[1]; cad.fotos = v.fotos.length ? v.fotos : ["svg:#8E959C", "svg:#C8D3E0", "svg:#E9EDF2", "svg:#DDE6EE"]; mostrar(); };
    mostrar();
    $("#seg2").onclick = () => { if (!cad.fotos.length) $("#fotex").click(); cad.passo = 3; render(); };
  }
  if (cad.passo === 3) {
    const cs = [["Site " + MARCA.nome, "página do caminhão com simulador e botão de proposta", 1], ["Mercado Livre Veículos", "anúncio com ficha técnica completa", 1], ["OLX", "anúncio na categoria caminhões", 1], ["Webmotors", "estoque da loja (plano lojista)", 1], ["Instagram", "post e story prontos, com preço e link", 0]];
    corpo.innerHTML = `<div class="cad"><div class="card"><h3 style="font-size:16px;margin-bottom:10px">Onde publicar</h3><div class="canais-pub">${cs.map(([n, d, on], i) => `<label><input type="checkbox" ${on ? "checked" : ""} data-c="${i}"><span>${n}<small>${d}</small></span><span id="st${i}" class="eti">—</span></label>`).join("")}</div>
        <button class="btn ok" id="pub" style="width:100%;margin-top:14px">Publicar em todos</button><div class="prog" style="margin-top:12px"><i id="pbar"></i></div></div>
      <div class="card"><h3 style="font-size:16px;margin-bottom:10px">Prévia do anúncio</h3>${cardVeiculo({ ...VEICULOS[1], id: "novo" })}
        <p style="font-size:13px;color:var(--cinza);margin:12px 0 0">Mudou o preço ou vendeu? Altere uma vez no painel: o sistema atualiza ou tira o anúncio de todos os canais.</p></div></div>`;
    $("#pub").onclick = () => {
      const sel = [...document.querySelectorAll("[data-c]")].filter((x) => x.checked).map((x) => +x.dataset.c);
      sel.forEach((i, k) => { $("#st" + i).textContent = "enviando…"; setTimeout(() => { $("#st" + i).className = "eti ok"; $("#st" + i).textContent = "✓ no ar"; $("#pbar").style.width = ((k + 1) / sel.length) * 100 + "%"; if (k === sel.length - 1) toast("Caminhão publicado em " + sel.length + " canais"); }, MARCA.rapido ? 5 : 500 + k * 450); });
    };
  }
}
function camposFicha(d) {
  const c = [["Marca", "marca"], ["Modelo", "modelo"], ["Versão", "versao"], ["Ano fab./modelo", null], ["Placa", "placa"], ["Cor", "cor"], ["Combustível", "comb"], ["Carroceria", "carroceria"], ["Potência", "potencia"], ["Chassi (interno)", "chassi"], ["RENAVAM (interno)", "renavam"]];
  return c.map(([r, k]) => `<label>${r}<input class="${d ? "lido" : ""}" value="${d ? esc(k ? d[k] : d.anoF + "/" + d.anoM) : ""}" placeholder="aguardando documento"></label>`).join("");
}
function painelAnuncios() {
  const cn = ["Site", "ML", "OLX", "Webmotors"];
  return `<div class="cab-secao"><div><h2>Anúncios e canais</h2><p class="sub" style="margin:0">Cada caminhão em todos os canais, com visitas e clientes de cada um</p></div><a class="btn esc pq" href="#painel" id="irCad">+ Cadastrar caminhão</a></div>
  <div class="card rolagem"><table class="tb"><tr><th>Caminhão</th><th>Preço</th>${cn.map((c) => `<th>${c}</th>`).join("")}<th>Visitas</th><th>Clientes</th><th>No estoque</th></tr>
  ${VEICULOS.filter((v) => v.cond === "Seminovo").map((v, i) => `<tr><td><b>${esc(v.modelo)}</b><br><small style="color:var(--cinza)">${v.ano} · ${esc(UNIDADES[v.unidade].curto)}</small></td><td>${brl(v.preco)}</td>${cn.map((c) => `<td>${(CANAIS_V[v.id] || []).includes(c) ? `<span class="eti ok">no ar</span>` : `<span class="eti">—</span>`}</td>`).join("")}<td>${[812, 1430, 655, 990, 1205, 470, 380, 760, 1610, 290][i]}</td><td>${[9, 14, 4, 7, 11, 3, 2, 6, 15, 1][i]}</td><td>${v.dias > 60 ? `<span class="eti al">${v.dias} dias</span>` : v.dias + " dias"}</td></tr>`).join("")}</table></div>`;
}
function painelLeads() {
  const cor = { Site: "var(--c1)", "Mercado Livre": "#B58900", OLX: "#7C3AED", WhatsApp: "#16A34A", Webmotors: "#DC2626" };
  return `<div class="cab-secao"><div><h2>Clientes e propostas</h2><p class="sub" style="margin:0">Todo interessado, de qualquer canal, num só lugar e com o vendedor responsável</p></div></div>
  <div class="kanban">${ETAPAS.map((et, i) => `<div class="col"><h4>${et}<span>${LEADS.filter((l) => l.e === i).length}</span></h4>${LEADS.map((l, k) => (l.e === i ? `<div class="lead"><span class="ori" style="color:${cor[l.o]}">${l.o}</span><b>${esc(l.n)}</b><span>${esc(l.v)}</span><span class="tmp ${l.al ? "al" : ""}">⏱ ${l.t}${l.al ? " sem resposta" : ""} · ${esc(UNIDADES[l.u].curto)}</span>${i < 4 ? `<button data-av="${k}">Avançar →</button>` : ""}</div>` : "")).join("")}</div>`).join("")}</div>`;
}
function ligarLeads() { document.querySelectorAll("[data-av]").forEach((b) => (b.onclick = () => { const l = LEADS[+b.dataset.av]; l.e++; l.al = 0; l.t = "agora"; render(); })); }
function painelPecas() {
  const ev = [["09:42", "Filtro de óleo do motor", "vendido no Mercado Livre", "estoque do site baixou de 19 para 18"], ["09:15", "Lâmpada H7 24V (par)", "vendida no balcão de Maringá", "Mercado Livre e site atualizados"], ["08:58", "Kit de embreagem completo", "vendido no site (Pix)", "anúncio do Mercado Livre pausado: última unidade"]];
  return `<div class="cab-secao"><div><h2>Peças: um estoque para todos os canais</h2><p class="sub" style="margin:0">O mesmo motor que já roda em lojas de autopeças com milhares de anúncios no Mercado Livre</p></div></div>
  <div class="kpis"><div class="kpi"><small>Peças anunciadas</small><b>1.284</b><span>site + Mercado Livre</span></div><div class="kpi"><small>Vendas online (30 dias)</small><b>212</b><span>R$ 46,3 mil</span></div><div class="kpi"><small>Venda sem estoque</small><b>0</b><span>baixa automática</span></div><div class="kpi"><small>Perguntas respondidas</small><b>96%</b><span>em menos de 1 h</span></div></div>
  <div class="card" style="margin-top:16px"><h3 style="font-size:16px;margin-bottom:8px">O que aconteceu hoje</h3>${ev.map(([h, p, o, r]) => `<p style="margin:0 0 8px"><b>${h}</b> · ${p} ${o} → <span style="color:var(--ok);font-weight:700">${r}</span></p>`).join("")}</div>
  <div class="card rolagem" style="margin-top:16px"><table class="tb"><tr><th>Peça</th><th>Preço</th>${UNIDADES.map((u) => `<th>${esc(u.curto)}</th>`).join("")}<th>Site</th><th>Mercado Livre</th></tr>${PECAS.map((p) => `<tr><td><b>${esc(p.nome)}</b></td><td>${brl(p.preco)}</td>${p.est.map((e) => `<td>${e}</td>`).join("")}<td><span class="eti ok">no ar</span></td><td>${p.ml ? `<span class="eti ok">no ar</span>` : `<span class="eti">publicar</span>`}</td></tr>`).join("")}</table></div>`;
}

/* ---------- quanto rende ---------- */
const GANHO = { leads: 40, fech: 8, ticket: 260000, extra: 20, pontos: 1, pecasPed: 120, pecasTicket: 380, anuncios: 30, min: 40, canais: 4, hora: 45 };
function telaGanho() {
  const c = [["leads", "Clientes interessados em caminhão por mês (hoje)"], ["fech", "Fechamento hoje (%)"], ["ticket", "Valor médio do caminhão vendido (R$)"], ["extra", "Interessados a mais vindos do site e marketplaces"], ["pontos", "Pontos a mais de fechamento (resposta rápida)"], ["pecasPed", "Pedidos de peças online por mês"], ["pecasTicket", "Valor médio do pedido de peças (R$)"], ["anuncios", "Caminhões anunciados por mês"], ["min", "Minutos para anunciar em cada canal (hoje)"], ["canais", "Canais de anúncio"], ["hora", "Custo da hora da equipe (R$)"]];
  return `<h2>Quanto rende para a sua loja?</h2><p class="sub">Coloque os números da loja. Os padrões são só um exemplo.</p>
  <div class="ganho"><div class="card">${c.map(([k, r]) => `<label>${r}<input type="number" data-g="${k}" value="${GANHO[k]}"></label>`).join("")}</div><div class="result-g" id="resg"></div></div>`;
}
function ligarGanho() {
  const calc = () => {
    document.querySelectorAll("[data-g]").forEach((i) => (GANHO[i.dataset.g] = +i.value || 0));
    const g = GANHO, hoje = (g.leads * g.fech) / 100, depois = ((g.leads + g.extra) * (g.fech + g.pontos)) / 100, mais = depois - hoje;
    const fatCam = mais * g.ticket, fatPec = g.pecasPed * g.pecasTicket, horas = (g.anuncios * g.min * Math.max(0, g.canais - 1)) / 60;
    $("#resg").innerHTML = `<span style="opacity:.75">Faturamento a mais por mês (exemplo)</span><div class="big">${brl(fatCam + fatPec)}</div>
      <div class="ln"><span>Caminhões vendidos por mês</span><b>${hoje.toFixed(1).replace(".", ",")} → ${depois.toFixed(1).replace(".", ",")}</b></div>
      <div class="ln"><span>Vendas a mais em caminhões</span><b>${brl(fatCam)}</b></div>
      <div class="ln"><span>Peças vendidas online</span><b>${brl(fatPec)}</b></div>
      <div class="ln"><span>Horas de cadastro economizadas</span><b>${Math.round(horas)} h · ${brl(horas * g.hora)}</b></div>
      <small style="opacity:.7">Simulação hipotética. Os números reais saem do diagnóstico com a equipe.</small>`;
  };
  document.querySelectorAll("[data-g]").forEach((i) => (i.oninput = calc)); calc();
}

/* ---------- roteador ---------- */
function render() {
  const h = (location.hash || "#inicio").slice(1);
  const [r, id] = h.startsWith("veiculo-") ? ["veiculo", h.slice(8)] : [h];
  document.querySelectorAll("#menu a").forEach((a) => a.classList.toggle("ativo", a.dataset.r === r || (r === "veiculo" && a.dataset.r === "estoque")));
  const app = $("#app");
  const T = { inicio: [telaInicio, ligarInicio], estoque: [telaEstoque, ligarEstoque], veiculo: [() => telaVeiculo(id), () => ligarVeiculo(id)], avaliacao: [telaAvaliacao, ligarAvaliacao], pecas: [telaPecas, ligarPecas], carrinho: [telaCarrinho, ligarCarrinho], painel: [telaPainel, ligarPainel], ganho: [telaGanho, ligarGanho] }[r] || [telaInicio, ligarInicio];
  app.innerHTML = T[0](); T[1]();
}
let ultimaRota = "";
window.addEventListener("hashchange", () => { const r = location.hash; if (r !== ultimaRota) { ultimaRota = r; render(); window.scrollTo(0, 0); } });
document.addEventListener("click", (e) => { const a = e.target.closest("#irCad"); if (a) { e.preventDefault(); estado.abaPainel = "cadastro"; render(); } });

/* cenas para os prints (?cena=...) */
const cena = new URLSearchParams(location.search).get("cena");
if (cena) MARCA.rapido = true;
if (cena === "carrinho") { estado.carrinho = [{ id: "p1", qtd: 2 }, { id: "p3", qtd: 1 }, { id: "p5", qtd: 1 }]; }
if (cena === "doc") { estado.abaPainel = "cadastro"; estado.cad = { passo: 1, doc: crlvExemplo(), fotos: [], dados: { marca: "Volkswagen", modelo: "Constellation 24.280", versao: "CRM 6x2", anoF: "2020", anoM: "2021", placa: "ABC1D23", chassi: "9BW•••••••••00000", renavam: "•••••••678-9", cor: "Branca", comb: "Diesel", carroceria: "Aberta", potencia: "280 cv" } }; }
if (cena === "publicar") { estado.abaPainel = "cadastro"; estado.cad = { passo: 3, doc: null, fotos: [], dados: {} }; }
if (cena === "leads") estado.abaPainel = "leads";
if (cena === "anuncios") estado.abaPainel = "anuncios";
if (cena === "pecaspainel") estado.abaPainel = "pecas";
attCarrinho(); render();
if (cena === "publicar") setTimeout(() => $("#pub").click(), 50);
</script>
